<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bulk Subscription CSV Generator</title>
<link rel="icon" type="image/png" href="icon.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="container">
  <h1><img src="icon.png" alt="" class="title-icon" />Bulk Subscription — CSV Generator</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="cancel">Bulk Cancel Subscription</button>
    <button type="button" class="tab" role="tab" data-tab="eligibility">Bulk Eligibility</button>
  </div>

  <div class="panel">
    <label for="input">DBeaver data (tab, comma, or space separated — one row per line)</label>
    <textarea id="input"></textarea>
    <div class="hint" id="hint"></div>

    <div class="row">
      <div class="field">
        <label for="date">Date for filename</label>
        <input type="date" id="date" />
      </div>
      <div class="field">
        <label for="seq">Sequence (XX, per day)</label>
        <input type="number" id="seq" min="1" max="99" value="1" />
      </div>
    </div>

    <div class="filename-preview" id="filenamePreview"></div>
    <div id="error" class="error"></div>
    <div id="count" class="count"></div>

    <button id="downloadBtn" disabled>Download CSV</button>
  </div>

  <div class="panel" id="previewPanel" style="display:none;">
    <label>Preview</label>
    <table id="previewTable"></table>
  </div>
</div>

<!-- Load order matters: config first, then the pure helpers, then the UI wiring -->
<script src="js/config.js"></script>
<script src="js/csv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
